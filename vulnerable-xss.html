<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vulnerable DOM XSS Demo</title>
</head>
<body>
  <h1>Vulnerable DOM XSS Demo</h1>
  <p>This page is intentionally vulnerable. It writes untrusted input to <code>innerHTML</code>.</p>

  <div id="welcome" style="padding: 10px; border: 1px solid #ccc;"></div>

  <h2>Try</h2>
  <ul>
    <li><code>?name=Alice</code></li>
    <li><code>?name=&lt;img src=x onerror=alert('XSS')&gt;</code></li>
  </ul>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name") ?? "";

    // ❌ Vulnerable sink: interprets attacker-controlled HTML/JS
    document.getElementById("welcome").innerHTML = `Welcome, ${name}!`;
  </script>
</body>
</html>
